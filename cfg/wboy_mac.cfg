<?xml version="1.0"?>
<!--
    DEPRECATED — DO NOT LOAD.
    Este ctrlr file es historical reference only (preserved en disco
    como comparación del diseño previo).

    Los mappings activos están en cfg/wboy.cfg (auto-load via inipath),
    con X=jump, Z=shoot, arrows. play_mame.py y mame_play.sh ya NO
    pasan -ctrlr wboy_mac después de Fase 3 arcade-ai (Turno ~6).

    El diseño original tenía KEYCODE_LALT (Option - interceptado por
    macOS char entry) y KEYCODE_LCONTROL (Ctrl - choca con Mission
    Control shortcuts). Por eso no disparaba ni saltaba.

    Si necesitas consultar el diseño legacy, lee este archivo.
    Si encuentras referencia a `-ctrlr wboy_mac` en scripts,
    bórrala: MAME precedence hace que -ctrlr pisotee cfg/wboy.cfg.
-->
<!-- Ctrlr Wonder Boy Mac: salto=Ctrl, disparo=Alt -->
<mameconfig version="10">
    <system name="wboy">
        <input>
            <port type="P1_JOYSTICK_RIGHT">
                <newseq type="standard">KEYCODE_RIGHT</newseq>
            </port>
            <port type="P1_JOYSTICK_LEFT">
                <newseq type="standard">KEYCODE_LEFT</newseq>
            </port>
            <port type="P1_BUTTON1">
                <newseq type="standard">KEYCODE_LCONTROL</newseq>
            </port>
            <port type="P1_BUTTON2">
                <newseq type="standard">KEYCODE_LALT</newseq>
            </port>
        </input>
    </system>
</mameconfig>
