<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arcade AI — Play</title>
<link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="play-body">
  <div class="topbar play-topbar">
    <div class="brand">
      <button class="back-btn" id="back-btn" data-i18n="playBack">← Back</button>
      <h1 id="play-title">🕹️ Arcade AI</h1>
    </div>
    <div class="play-meta">
      <span class="play-agent"><span data-i18n="aiSelectAgent">Agent</span>: <b id="play-agent">–</b></span>
      <span id="play-live-tag" class="live-tag" style="visibility:hidden;">
        <span class="live-dot"></span> <span data-i18n="aiLive">LIVE</span>
      </span>
    </div>
  </div>

  <main class="play-main">
    <!-- Live stream (hosted ALE games) -->
    <section id="play-stream" class="play-stream" style="display:none;">
      <div class="play-screen-wrap" id="play-screen-wrap">
        <div class="play-screen-toolbar">
          <button type="button" class="secondary screen-btn" id="fullscreen-btn" data-i18n="playFullscreen">⛶ Fullscreen</button>
          <button type="button" class="secondary screen-btn" id="mute-btn" data-i18n="playMute" style="display:none;">🔊 Sound</button>
        </div>
        <div class="crt play-crt" id="play-crt">
          <div class="placeholder" id="play-placeholder" data-i18n="playOpening">Connecting…</div>
          <canvas id="play-canvas" width="160" height="210" style="display:none;"></canvas>
          <img id="play-stream-img" alt="" class="play-stream-img" style="display:none;" />
        </div>
      </div>

      <div class="play-sidebar">
        <div class="hud play-hud">
          <span><span data-i18n="aiEpisode">Episode</span>: <b id="hud-episode">–</b></span>
          <span><span data-i18n="aiStep">Step</span>: <b id="hud-step">–</b></span>
          <span><span data-i18n="aiReward">Reward</span>: <b id="hud-reward">–</b></span>
        </div>

        <div class="play-buttons">
          <button class="secondary" id="stop-btn" data-i18n="aiStop">Stop</button>
          <button class="primary" id="restart-btn" data-i18n="playRestart">Restart</button>
        </div>

        <div id="play-error" class="notice-error"></div>

        <div class="card trace-card">
          <h2 data-i18n="traceTitle">Decision trace (live)</h2>
          <table>
            <thead><tr id="trace-header"></tr></thead>
            <tbody id="trace-body"></tbody>
          </table>
          <p id="trace-empty" data-i18n="traceEmpty" style="margin-top:0.5rem;"></p>
        </div>
      </div>
    </section>

    <!-- MAME educational demo (ROM verified on server) -->
    <section id="play-mame" class="play-stream" style="display:none;">
      <div class="play-screen-wrap" id="mame-screen-wrap">
        <div class="play-screen-toolbar">
          <button type="button" class="secondary screen-btn" id="mame-snap-pause-btn" data-i18n="mameSnapPause">⏸ Pause</button>
          <button type="button" class="secondary screen-btn" id="mame-fullscreen-btn" data-i18n="playFullscreen">⛶ Fullscreen</button>
        </div>
        <div class="crt play-crt" id="mame-crt">
          <div class="placeholder" id="mame-placeholder" data-i18n="aiConnecting">Loading…</div>
          <div class="mame-snap-carousel" id="mame-snap-carousel" aria-hidden="true">
            <img id="mame-snap-a" class="mame-snap-layer" alt="" />
            <img id="mame-snap-b" class="mame-snap-layer" alt="" />
          </div>
        </div>
      </div>

      <div class="play-sidebar">
        <div class="hud play-hud">
          <span id="mame-demo-tag" class="live-tag educational-tag" style="visibility:visible;">
            <span class="live-dot edu-dot"></span> <span data-i18n="mameDemoLiveTag">EDUCATIONAL DEMO</span>
          </span>
          <span><span data-i18n="mameSnapFrame">Frame</span>: <b id="mame-snap-frame">–</b></span>
        </div>
        <p id="mame-demo-body" class="callout" data-i18n="mameDemoBody"></p>

        <div class="card trace-card">
          <h2 data-i18n="mameLuaTitle">Lua agent source</h2>
          <pre id="mame-lua-source" class="lua-source"></pre>
        </div>
      </div>
    </section>

    <!-- Not available (no ROM on server) -->
    <section id="play-unavailable" class="play-unavailable" style="display:none;">
      <div class="card callout-card">
        <h2 id="unavailable-title" data-i18n="mameNoticeTitle"></h2>
        <p id="unavailable-body"></p>
        <button class="primary" id="unavailable-back-btn" data-i18n="playBack">← Back</button>
      </div>
    </section>
  </main>

  <div id="legal-modal" class="legal-modal" style="display:none;">
    <div class="legal-modal-card card">
      <h2 id="legal-modal-title" data-i18n="legalDisclaimerTitle">Legal notice</h2>
      <p id="legal-modal-body" data-i18n="legalDisclaimerBody"></p>
      <div class="legal-modal-actions">
        <button class="secondary" id="legal-decline-btn" data-i18n="legalDecline">Cancel</button>
        <button class="primary" id="legal-accept-btn" data-i18n="legalAccept">Accept</button>
      </div>
    </div>
  </div>

  <script src="/static/play.js?v=20260709b"></script>
</body>
</html>
