# Juegos disponibles en la demo local.
# ALE = Atari 2600 (funciona en macOS sin MAME).
# MAME = requiere emulador + ROM legal (ver README).

default_game: breakout

ale_games:
  breakout:
    env_id: "ALE/Breakout-v5"
    year: 1976
    description: "Clásico de ladrillos — ideal para empezar con RL"
  pong:
    env_id: "ALE/Pong-v5"
    year: 1972
    description: "Pong — dos palas, acciones simples"
  space_invaders:
    env_id: "ALE/SpaceInvaders-v5"
    year: 1978
    description: "Space Invaders — shoot'em up icónico"
  pacman:
    env_id: "ALE/MsPacman-v5"
    year: 1982
    description: "Ms. Pac-Man — laberinto y fantasmas"
  tetris:
    env_id: "ALE/Tetris-v5"
    year: 1988
    description: "Tetris Atari 2600 — piezas y líneas"

mame_games:
  tempest:
    game_id: tempest
    year: 1981
    description: "Tempest — ver ArcadeAI / MAME + Lua"
    rom: tempest.zip
  pacman:
    game_id: pacman
    year: 1980
    description: "Pac-Man arcade — el original (Namco)"
    rom: pacman.zip
    mame_width: 224
    mame_height: 288
    ai_script: pacman_ai.lua
    teach_script: pacman_record_play.lua
  dkong:
    game_id: dkong
    year: 1981
    description: "Donkey Kong"
    rom: dkong.zip
  atetris:
